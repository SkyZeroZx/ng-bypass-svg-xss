<!--
  The negative controls: a sprite from the app's own reviewed file, and the
  uploaded file through an ordinary <img>. I keep both in the matrix so a run
  that reports nothing can be told apart from a run that is broken.
-->
<h2>Safe sprite and ordinary image controls</h2>
<svg width="100" height="100" aria-label="safe sprite">
  <use id="bound-use" href="/safe.svg#safe"></use>
</svg>
<img id="img-control" src="/asset.svg#x" alt="ordinary image control" />
